x-airflow-image: &airflow-image
  image: inflow-airflow:3.4.0
  build:
    context: .
    dockerfile: orchestration/Dockerfile

services:
  postgres:
    image: postgres:15-alpine
    container_name: inflow_postgres
    command:
      [
        "postgres",
        "-c", "wal_level=logical",
        "-c", "max_replication_slots=10",
        "-c", "max_wal_senders=10",
        "-c", "max_slot_wal_keep_size=1GB"
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-inflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/oltp:/docker-entrypoint-initdb.d:roZ
      - ./scripts/sql/oltp/012_cnpj_owners.sql:/migrations/012_cnpj_owners.sql:roZ
      - ./scripts/sql/oltp/013_donos_finais.sql:/migrations/013_donos_finais.sql:roZ
      - ./scripts/sql/oltp/014_cdc_publication.sql:/migrations/014_cdc_publication.sql:roZ
      - ./scripts/sql/oltp/015_janela_despesas.sql:/migrations/015_janela_despesas.sql:roZ
      - ./scripts/sql/monitoring/001_monitoring.sql:/docker-entrypoint-initdb.d/010_monitoring.sql:roZ
      - ./scripts/sql/bronze/001_raw_payloads.sql:/docker-entrypoint-initdb.d/020_bronze.sql:roZ
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inflow_user} -d ${POSTGRES_DB:-inflow_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - inflow_network
  ingestion:
    container_name: inflow_ingestion
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    volumes:
      - ./tests:/tests:ro
      - cnpj_cache:/cache/cnpj
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inflow_db}
      DB_USER: ${POSTGRES_USER:-inflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
      INGESTION_YEAR: ${INGESTION_YEAR:-2024}
      LIMIT_SENADORES: ${LIMIT_SENADORES:-0}
      LEGISLATURE: ${LEGISLATURE:-57}
      ENABLE_CNPJ_OWNERS: ${ENABLE_CNPJ_OWNERS:-1}
      RFB_CNPJ_TOKEN: ${RFB_CNPJ_TOKEN:-gn672Ad4CF8N6TK}
      RFB_CNPJ_MONTH: ${RFB_CNPJ_MONTH:-}
      CNPJ_OWNER_MAX_DEPTH: ${CNPJ_OWNER_MAX_DEPTH:-5}
      LATE_DATA_ALLOWED_MONTHS: ${LATE_DATA_ALLOWED_MONTHS:-2}
      CNPJ_CACHE_DIR: /cache/cnpj
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inflow_network

  analytics:
    container_name: inflow_analytics
    build:
      context: .
      dockerfile: analytics/Dockerfile
    volumes:
      - ./lake:/lake
      - ./tests:/tests:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inflow_db}
      DB_USER: ${POSTGRES_USER:-inflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
      LAKE_DIR: /lake
      LAKE_FRESHNESS_SLA_HOURS: ${LAKE_FRESHNESS_SLA_HOURS:-26}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inflow_network

  modeling:
    profiles: ["modeling"]
    build:
      context: .
      dockerfile: analytics/dbt/Dockerfile
    user: "${MODELING_UID:-1000}:${MODELING_GID:-1000}"
    volumes:
      - type: bind
        source: ./analytics/dbt/target
        target: /app/dbt/target
        bind:
          create_host_path: false
      - type: bind
        source: ./analytics/dbt/logs
        target: /app/dbt/logs
        bind:
          create_host_path: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inflow_db}
      DB_USER: ${POSTGRES_USER:-inflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inflow_network

  airflow-db:
    profiles: ["orchestration"]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - inflow_network

  airflow-init:
    <<: *airflow-image
    profiles: ["orchestration"]
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        mkdir -p /lake /cache/cnpj /opt/airflow/state
        chown -R 50000:0 /lake /cache/cnpj /opt/airflow/state
    volumes:
      - ./lake:/lake
      - cnpj_cache:/cache/cnpj
      - airflow_state:/opt/airflow/state
    networks:
      - inflow_network

  airflow:
    <<: *airflow-image
    profiles: ["orchestration"]
    # O pool que serializa ingestão/lake precisa existir antes do primeiro run.
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow pools set inflow_exclusivo 1 "Serializa ingestão, lake e backfill"
        exec airflow standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: manu:admin
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inflow_db}
      DB_USER: ${POSTGRES_USER:-inflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
      INGESTION_YEAR: ${INGESTION_YEAR:-2024}
      LIMIT_SENADORES: ${LIMIT_SENADORES:-0}
      LEGISLATURE: ${LEGISLATURE:-57}
      ENABLE_CNPJ_OWNERS: ${ENABLE_CNPJ_OWNERS:-1}
      RFB_CNPJ_TOKEN: ${RFB_CNPJ_TOKEN:-gn672Ad4CF8N6TK}
      RFB_CNPJ_MONTH: ${RFB_CNPJ_MONTH:-}
      CNPJ_OWNER_MAX_DEPTH: ${CNPJ_OWNER_MAX_DEPTH:-5}
      CNPJ_CACHE_DIR: /cache/cnpj
      LATE_DATA_ALLOWED_MONTHS: ${LATE_DATA_ALLOWED_MONTHS:-2}
      LAKE_DIR: /lake
      LAKE_FRESHNESS_SLA_HOURS: ${LAKE_FRESHNESS_SLA_HOURS:-26}
    volumes:
      - ./lake:/lake
      - cnpj_cache:/cache/cnpj
      - airflow_state:/opt/airflow/state
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - inflow_network

  benchmark-real:
    profiles: ["benchmark"]
    build:
      context: .
      dockerfile: analytics/benchmark.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inflow_db}
      DB_USER: ${POSTGRES_USER:-inflow_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
    volumes:
      - ./resultados/benchmark-lake:/resultados:Z
    command: ["--source", "oltp"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inflow_network

  docs:
    profiles: ["docs"]
    container_name: inflow_docs
    build:
      context: ./documentation
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT:-3000}:80"
    restart: unless-stopped

  zookeeper:
    image: debezium/zookeeper:2.7.3.Final
    container_name: inflow_zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper_data:/zookeeper/data
      - zookeeper_txns:/zookeeper/txns
    networks:
      - inflow_network

  kafka:
    image: debezium/kafka:2.7.3.Final
    container_name: inflow_kafka
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/kafka/data
    networks:
      - inflow_network

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: inflow_kafka_connect
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: inflow_cdc
      CONFIG_STORAGE_TOPIC: inflow_connect_configs
      OFFSET_STORAGE_TOPIC: inflow_connect_offsets
      STATUS_STORAGE_TOPIC: inflow_connect_statuses
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_DB: ${POSTGRES_DB:-inflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-inflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inflow_pass}
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - inflow_network

volumes:
  airflow_db:
  airflow_state:
  postgres_data:
    name: inflow_postgres_data
  cnpj_cache:
    name: inflow_cnpj_cache
  zookeeper_data:
    name: inflow_zookeeper_data
  zookeeper_txns:
    name: inflow_zookeeper_txns
  kafka_data:
    name: inflow_kafka_data

networks:
  inflow_network:
    name: inflow_network
    driver: bridge
